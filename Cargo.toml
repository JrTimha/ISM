[package]
name = "ism"
version = "0.8.3"
description = "Social backend services for user relationships and chatting"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
tokio = {version = "1.53.1", features = ["full"]}
tower = "0.5.3"
config = "0.15.25"
serde = "1.0.229"
futures = "0.3.33"
uuid = { version = "1.24.0", features = ["v4", "serde", "v7"] }
chrono = { version = "0.4.45", features = ["serde"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = {version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "json"]}
serde_json = "1.0.151"
tokio-stream = { version = "0.1.19", features = ["sync"] }
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
minio = { version = "0.3.0", features = ["default"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
bytes = "1.12.1"
base64 = "0.23.0"
validator = { version = "0.21.0", features = ["derive"] }
redis = { version = "1.4.1", features = ["tokio-comp", "connection-manager"] }
thiserror = "2.0.19"
async-trait = "0.1.91"

#used by the auth-domain:
educe = { version = "0.7.4", default-features = false, features = ["Debug"] }
http = "1.4.2"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde_with = "3.21.0"
typed-builder = "0.23.2"
url = "2.5.8"


[dev-dependencies]
# Used by tests/auth_attacks.rs, the black-box attack suite. Same versions as the runtime
# dependencies above, so they add nothing to the build graph — integration tests are separate
# crates and do not inherit `[dependencies]`.
base64 = "0.23.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
# `form` is what the Keycloak direct access grant is posted with; it affects the test build only.
reqwest = { version = "0.13.4", features = ["json", "form"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
